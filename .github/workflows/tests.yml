name: Shufersal Online Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers with dependencies
      run: |
        playwright install --with-deps chromium
    
    - name: Create required directories
      run: |
        mkdir -p screenshots
        mkdir -p reports
        mkdir -p temp/test_runs
    
    - name: Create .env file for CI
      run: |
        cat > .env << EOF
        # Browser Settings
        HEADLESS=true
        SLOW_MO=0
        BROWSER_TIMEOUT=30000
        
        # Test Environment
        TEST_ENV=ci
        BASE_URL=https://www.shufersal.co.il/online/he
        
        # Delivery Address (for modal handling)
        DELIVERY_CITY=תל אביב
        DELIVERY_STREET=דיזנגוף
        DELIVERY_STREET_NUMBER=1
        DELIVERY_APARTMENT=1
        
        # Delivery Time Slot - Set to a future date
        DELIVERY_DATE=20251115
        DELIVERY_TIME=14:00
        
        # Reporting
        SCREENSHOT_ON_FAILURE=true
        VIDEO_ON_FAILURE=false
        EOF
    
    - name: Run all tests
      run: |
        pytest tests/ -v --html=reports/full-report.html --self-contained-html
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-py${{ matrix.python-version }}
        path: reports/
        retention-days: 30
    
    - name: Upload screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots-py${{ matrix.python-version }}
        path: screenshots/
        retention-days: 7
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-py${{ matrix.python-version }}
        path: temp/test_runs/
        retention-days: 7
    
    - name: Test Summary
      if: always()
      run: |
        echo "### Test Results for Python ${{ matrix.python-version }} 🧪" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/full-report.html ]; then
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Tests failed or were skipped" >> $GITHUB_STEP_SUMMARY
        fi
